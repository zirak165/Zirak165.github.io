name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build site
        run: npm run build:site
        
      - name: Find output directory
        id: find_dir
        run: |
          echo "بررسی پوشه‌های احتمالی خروجی..."
          if [ -d "_site" ]; then
            echo "dir=_site" >> $GITHUB_OUTPUT
            echo "پوشه _site پیدا شد."
          elif [ -d "dist" ]; then
            echo "dir=dist" >> $GITHUB_OUTPUT
            echo "پوشه dist پیدا شد."
          elif [ -d "public" ]; then
            echo "dir=public" >> $GITHUB_OUTPUT
            echo "پوشه public پیدا شد."
          elif [ -d "_output" ]; then
            echo "dir=_output" >> $GITHUB_OUTPUT
            echo "پوشه _output پیدا شد."
          else
            echo "هیچ پوشه استانداردی پیدا نشد. لیست فایل‌ها:"
            ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dir.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
