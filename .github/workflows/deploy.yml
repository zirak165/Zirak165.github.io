name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Find project directory
        id: find_project
        run: |
          # پیدا کردن مسیری که package.json در آن قرار دارد
          PROJ_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          if [ -z "$PROJ_DIR" ] || [ "$PROJ_DIR" == "." ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "dir=$PROJ_DIR" >> $GITHUB_OUTPUT
          fi
          echo "پروژه در مسیر $PROJ_DIR پیدا شد."

      - name: Install dependencies
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: npm install
        
      - name: Build site
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: npm run build:site
        
      - name: Find output directory
        id: find_dir
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: |
          echo "بررسی پوشه‌های احتمالی خروجی..."
          if [ -d "_site" ]; then
            echo "dir=_site" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            echo "dir=dist" >> $GITHUB_OUTPUT
          elif [ -d "public" ]; then
            echo "dir=public" >> $GITHUB_OUTPUT
          elif [ -d "_output" ]; then
            echo "dir=_output" >> $GITHUB_OUTPUT
          else
            echo "هیچ پوشه استانداردی پیدا نشد. لیست فایل‌ها:"
            ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ترکیب مسیر پروژه و پوشه خروجی
          path: ${{ steps.find_project.outputs.dir }}/${{ steps.find_dir.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
